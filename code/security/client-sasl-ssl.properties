# Kafka CLI araçları için istemci ayarları
# Kullanım: kafka-topics.sh --bootstrap-server broker-1.kafka.example.com:9092 --command-config client-sasl-ssl.properties --list
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="DEGISTIRIN";
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=DEGISTIRIN
