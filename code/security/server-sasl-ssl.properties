# =============================================================================
# PRODUCTION broker güvenlik ayarları (KRaft, SASL_SSL + SCRAM-SHA-512 + ACL)
# Dosya: code/security/server-sasl-ssl.properties  (server.properties'e eklenecek bölüm)
# Kafka 4.x. Değerleri kendi ortamınıza göre değiştirin.
# =============================================================================
process.roles=broker
node.id=4
controller.quorum.bootstrap.servers=controller-1:9093,controller-2:9093,controller-3:9093
controller.listener.names=CONTROLLER

listeners=INTERNAL://0.0.0.0:9094,CLIENT://0.0.0.0:9092
advertised.listeners=INTERNAL://broker-1.kafka.internal:9094,CLIENT://broker-1.kafka.example.com:9092
listener.security.protocol.map=CONTROLLER:SSL,INTERNAL:SASL_SSL,CLIENT:SASL_SSL
inter.broker.listener.name=INTERNAL

# --- TLS (encryption in transit) ---------------------------------------------
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/broker-1.keystore.p12
ssl.keystore.password=${file:/etc/kafka/secrets/ssl.properties:keystore_password}
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=${file:/etc/kafka/secrets/ssl.properties:truststore_password}
ssl.endpoint.identification.algorithm=https
ssl.enabled.protocols=TLSv1.3,TLSv1.2
# Controller dinleyicisinde mTLS
listener.name.controller.ssl.client.auth=required

# --- SASL/SCRAM (kimlik doğrulama) ---------------------------------------------
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="broker" password="${file:/etc/kafka/secrets/sasl.properties:broker_password}";

# --- Yetkilendirme (ACL) -------------------------------------------------------
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:broker;User:admin

# --- Secret'ları dosyadan okumak için ------------------------------------------
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider

# --- Dayanıklılık ---------------------------------------------------------------
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
auto.create.topics.enable=false
