# =============================================================================
# Tek broker'lı geliştirme ortamı (KRaft, ZooKeeper YOK)
# Dosya: code/docker/docker-compose.yml
# Çalıştırma:  docker compose -f code/docker/docker-compose.yml up -d
# Durdurma:    docker compose -f code/docker/docker-compose.yml down        (veri kalır)
# Sıfırlama:   docker compose -f code/docker/docker-compose.yml down -v     (veri silinir)
#
# Sürümler (2026-11 itibarıyla):
#   apache/kafka:4.4.0          -> Apache Kafka resmi image (KRaft)
#   ghcr.io/kafbat/kafka-ui:v1.5.0 -> Web arayüzü (provectus/kafka-ui'nin devamı)
# =============================================================================
name: kafka-dev

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"            # Host (laptop) üzerinden erişim: localhost:9092
    environment:
      # --- KRaft kimliği ve rolleri -------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # combined mode: sadece DEV için
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"           # kafka-storage.sh random-uuid ile üretilebilir
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listener'lar ---------------------------------------------------------
      # INTERNAL : Docker ağı içindeki diğer container'lar (connect, ui) -> kafka:19092
      # EXTERNAL : Host makinedeki Python kodları                    -> localhost:9092
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Tek broker olduğu için iç topic'lerin RF değeri 1 olmalı -------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # --- Geliştirme kolaylıkları ----------------------------------------------
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # topic'leri bilinçli oluşturalım
      KAFKA_LOG_RETENTION_HOURS: 168                   # 7 gün
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:
