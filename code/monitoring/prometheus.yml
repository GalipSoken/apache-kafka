# Dosya: code/monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: kafka-broker-jmx
    static_configs: [{targets: ["kafka:7071"]}]
  - job_name: kafka-exporter          # consumer lag, topic/partition offset'leri
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: kafka-connect
    static_configs: [{targets: ["connect:7072"]}]
