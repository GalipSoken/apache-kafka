# Prometheus JMX Exporter kuralları (Kafka broker)
# Dosya: code/monitoring/jmx-kafka.yml
# Broker'a javaagent olarak eklenir:
#   KAFKA_OPTS=-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/jmx-kafka.yml
lowercaseOutputName: true
rules:
  # kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions -> kafka_server_replicamanager_underreplicatedpartitions
  - pattern: kafka.server<type=(.+), name=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
  - pattern: kafka.server<type=(.+), name=(.+)><>Count
    name: kafka_server_$1_$2_total
    type: COUNTER
  # BrokerTopicMetrics: MessagesInPerSec, BytesInPerSec, BytesOutPerSec (topic etiketli)
  - pattern: kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>Count
    name: kafka_server_brokertopicmetrics_$1_total
    labels: {topic: "$2"}
    type: COUNTER
  # İstek gecikmeleri: Produce / FetchConsumer / FetchFollower
  - pattern: kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(Produce|FetchConsumer|FetchFollower)><>(\d+)thPercentile
    name: kafka_network_request_totaltimems
    labels: {request: "$1", quantile: "0.$2"}
    type: GAUGE
  - pattern: kafka.network<type=RequestChannel, name=RequestQueueSize><>Value
    name: kafka_network_requestchannel_requestqueuesize
    type: GAUGE
  - pattern: kafka.controller<type=KafkaController, name=(.+)><>Value
    name: kafka_controller_$1
    type: GAUGE
  - pattern: kafka.log<type=Log, name=Size, topic=(.+), partition=(.+)><>Value
    name: kafka_log_size_bytes
    labels: {topic: "$1", partition: "$2"}
    type: GAUGE
  - pattern: java.lang<type=Memory><HeapMemoryUsage>used
    name: jvm_heap_used_bytes
    type: GAUGE
