# Dosya: code/monitoring/alerts.yml  (Prometheus alerting rules)
groups:
  - name: kafka
    rules:
      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_server_replicamanager_underreplicatedpartitions) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Under-replicated partition var ({{ $value }})"
          description: "Bir veya daha fazla follower ISR dışında. Broker/disk/ağ kontrol edin."
      - alert: KafkaOfflinePartitions
        expr: sum(kafka_controller_offlinepartitionscount) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Lider'i olmayan (offline) partition var: veri yazılamıyor/okunamıyor"}
      - alert: KafkaNoActiveController
        expr: sum(kafka_controller_activecontrollercount) != 1
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Aktif controller sayısı 1 değil"}
      - alert: KafkaConsumerLagYuksek
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 10000
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.consumergroup }} / {{ $labels.topic }} lag {{ $value }}"}
      - alert: KafkaConsumerLagArtiyor
        expr: deriv(sum by (consumergroup) (kafka_consumergroup_lag)[15m:1m]) > 0
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.consumergroup }} lag 30 dk'dır sürekli artıyor (tüketici yetişemiyor)"}
      - alert: KafkaRequestQueueDolu
        expr: kafka_network_requestchannel_requestqueuesize > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Broker istek kuyruğu birikiyor (CPU / num.io.threads)"}
