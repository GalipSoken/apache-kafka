# =============================================================================
# Strimzi (Kubernetes operator) ile KRaft Kafka cluster'ı
# Dosya: code/k8s/strimzi-kafka.yaml
# Strimzi 1.x yalnızca kafka.strimzi.io/v1 API'sini destekler (v1beta2 kaldırıldı).
# Kafka sürümü, kurduğunuz Strimzi sürümünün desteklediği listeden seçilmelidir
# (Strimzi 1.2.0 -> Kafka 4.3.1 desteği eklendi).
# Kurulum: kubectl create namespace kafka
#          kubectl apply -f 'https://strimzi.io/install/latest?namespace=kafka' -n kafka
#          kubectl apply -f code/k8s/strimzi-kafka.yaml -n kafka
# =============================================================================
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controllers
  labels: {strimzi.io/cluster: banka-kafka}
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: persistent-claim
    size: 20Gi
    class: gp3
  resources:
    requests: {cpu: "500m", memory: 2Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels: {strimzi.io/cluster: banka-kafka}
spec:
  replicas: 3
  roles: [broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        class: gp3
        deleteClaim: false
  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {memory: 8Gi}
  template:
    pod:
      affinity:
        podAntiAffinity:            # broker'ları farklı node/AZ'lere yay
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {strimzi.io/pool-name: brokers}
              topologyKey: topology.kubernetes.io/zone
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: banka-kafka
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication: {type: scram-sha-512}
    authorization:
      type: simple
    rack:
      topologyKey: topology.kubernetes.io/zone   # rack-aware replica yerleşimi
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      unclean.leader.election.enable: false
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: islemler
  labels: {strimzi.io/cluster: banka-kafka}
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    min.insync.replicas: 2
    compression.type: zstd
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: svc-fraud-consumer
  labels: {strimzi.io/cluster: banka-kafka}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: islemler}
        operations: [Read, Describe]
      - resource: {type: group, name: fraud-skorlama}
        operations: [Read]
